              </div>
              <p style={{ marginTop: 24, textAlign: 'center', fontSize: 14, color: '#aaa' }}>
                {Object.values(checked).filter(Boolean).length} / {checklist.length} completati
              </p>
            </div>
          </section>

          {/* POLLS */}
          <section id="sondaggi" style={S.section}>
            <h2 style={S.h2}>Sondaggi</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 20 }}>
              {polls.map((poll, pi) => (
                <div key={pi} style={{ ...S.darkCard, padding: 28 }}>
                  <h3 style={{ fontSize: 22, fontWeight: 800, marginBottom: 24 }}>{poll.question}</h3>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                    {poll.options.map((option, oi) => (
                      <button key={oi} onClick={() => setVoted(p => ({ ...p, [pi]: oi }))}
                        style={{ width: '100%', borderRadius: 14, border: `1px solid ${voted[pi]===oi ? '#FF5A4F' : 'rgba(255,255,255,0.15)'}`, background: voted[pi]===oi ? '#FF5A4F' : 'rgba(255,255,255,0.05)', padding: '14px 18px', textAlign: 'left', color: 'white', fontSize: 15, cursor: 'pointer', transition: 'all 0.2s', fontFamily: "'DM Sans', sans-serif", fontWeight: voted[pi]===oi ? 700 : 400 }}>
                        {voted[pi]===oi ? '✓ ' : ''}{option}
                      </button>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* DMC */}
          <section id="dmc" style={{ maxWidth: 1280, margin: '0 auto', padding: '48px 24px 96px' }}>
            <h2 style={S.h2}>Contatti DMC</h2>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
              <div style={{ ...S.darkCard, padding: 36 }}>
                <p style={{ fontSize: 12, textTransform: 'uppercase', letterSpacing: '0.2em', color: '#FFB0AA', marginBottom: 12 }}>Partner Locale</p>
                <h3 style={{ fontSize: 28, fontWeight: 900, marginBottom: 8 }}>{dmc.name}</h3>
                <p style={{ fontSize: 18, color: '#ccc', marginBottom: 4 }}>👤 {dmc.contact}</p>
                <p style={{ fontSize: 20, fontWeight: 700, color: '#FF5A4F', marginBottom: 20 }}>📞 {dmc.phone}</p>
                <p style={{ fontSize: 14, color: '#888', lineHeight: 1.7 }}>{dmc.note}</p>
              </div>
              <div style={{ ...S.card, padding: 36 }}>
                <p style={{ fontSize: 14, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1, color: '#FF5A4F', marginBottom: 16 }}>Il DMC gestisce:</p>
                {['Alloggi', 'Transfer terrestri', 'Attività incluse nel pacchetto WR', 'Attività opzionali (prenotare tramite DMC)', 'Cambio valuta + SIM card', 'Emergenze e problemi in loco'].map((item, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: i < 5 ? '1px solid #f0f0f0' : 'none' }}>
                    <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#FF5A4F', flexShrink: 0 }} />
                    <span style={{ fontSize: 15 }}>{item}</span>
                  </div>
                ))}
              </div>
            </div>
          </section>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
