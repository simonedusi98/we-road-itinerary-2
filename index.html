<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Experience — WeRoad</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #FFF8F5; color: #1A1A1A; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #FF3D2E; border-radius: 3px; }

    /* COLORS */
    :root {
      --red: #FF3D2E;
      --red-light: #FF6B5E;
      --red-pale: #FFF0EE;
      --dark: #1A1A1A;
      --mid: #555;
      --light: #F7F2EE;
      --white: #FFFFFF;
      --border: #EDE8E3;
    }

    /* NAV */
    .navbar { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--border); }
    .navbar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 64px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .logo-text { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: var(--dark); }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-link { color: var(--mid); text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; transition: color 0.2s; white-space: nowrap; }
    .nav-link:hover { color: var(--red); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--dark); border-radius: 2px; transition: all 0.3s; }
    .mobile-menu { display: none; position: fixed; inset: 0; background: var(--white); z-index: 99; padding: 80px 32px 32px; flex-direction: column; gap: 8px; overflow-y: auto; }
    .mobile-menu.open { display: flex; }
    .mobile-link { font-size: 22px; font-weight: 700; color: var(--dark); text-decoration: none; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .mobile-link:hover { color: var(--red); }
    .mobile-close { position: absolute; top: 20px; right: 24px; font-size: 28px; cursor: pointer; background: none; border: none; color: var(--dark); }

    /* HERO */
    .hero { background: var(--red); color: white; padding: 56px 24px 48px; }
    .hero-inner { max-width: 1200px; margin: 0 auto; }
    .hero-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.7); margin-bottom: 14px; }
    .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(40px, 8vw, 80px); font-weight: 900; line-height: 1.05; margin-bottom: 16px; }
    .hero-sub { font-size: clamp(15px, 2vw, 18px); color: rgba(255,255,255,0.85); margin-bottom: 36px; line-height: 1.6; }
    .hero-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    .hero-stat { background: rgba(255,255,255,0.12); border-radius: 16px; padding: 16px; }
    .hero-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
    .hero-stat-val { font-size: 16px; font-weight: 700; }

    /* SECTIONS */
    .section { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: clamp(28px, 5vw, 44px); font-weight: 900; margin-bottom: 28px; color: var(--dark); }

    /* CARDS */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .card { background: var(--white); border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.09); }
    .card-red { background: var(--red); color: white; border: none; }
    .card-warm { background: var(--light); border: 1px solid var(--border); }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
    .badge-red { background: var(--red); color: white; }
    .badge-outline { background: transparent; border: 1.5px solid var(--dark); color: var(--dark); }
    .badge-green { background: #d4edda; color: #155724; }
    .badge-white { background: rgba(255,255,255,0.2); color: white; }

    /* ITINERARY */
    .timeline { border-left: 2px solid var(--border); padding-left: 28px; display: flex; flex-direction: column; gap: 16px; }
    .timeline-dot { position: absolute; left: -39px; top: 28px; width: 18px; height: 18px; border-radius: 50%; background: var(--red); border: 3px solid var(--white); box-shadow: 0 0 0 2px var(--red); }
    .day-card { background: var(--white); border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; position: relative; border: 1px solid var(--border); }
    .day-header { padding: 20px 24px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .day-body { padding: 0 24px 24px; border-top: 1px solid var(--border); }
    .tip-box { background: var(--red-pale); border-radius: 14px; padding: 18px; border: 1px solid #ffd5d1; }

    /* CHECKLIST */
    .check-item { display: flex; align-items: center; gap: 12px; border-radius: 14px; border: 1.5px solid var(--border); padding: 14px 16px; cursor: pointer; transition: all 0.2s; background: var(--white); }
    .check-item.done { border-color: var(--red); background: var(--red-pale); }
    .checkbox { width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; border: 2px solid #ccc; background: white; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .checkbox.done { border-color: var(--red); background: var(--red); }

    /* POLLS */
    .poll-option { width: 100%; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); padding: 14px 18px; text-align: left; color: white; font-size: 15px; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; font-weight: 500; }
    .poll-option:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.14); }
    .poll-option.voted { border-color: white; background: rgba(255,255,255,0.25); font-weight: 700; }

    /* ADMIN */
    .admin-trigger { position: fixed; bottom: 20px; right: 20px; background: var(--dark); color: white; border: none; border-radius: 999px; padding: 12px 20px; font-size: 13px; font-weight: 700; cursor: pointer; z-index: 998; box-shadow: 0 4px 20px rgba(0,0,0,0.25); font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .admin-trigger:hover { background: var(--red); }
    .admin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 16px; }
    .admin-modal { background: #1A1A1A; color: white; border-radius: 24px; padding: 40px; max-width: 460px; width: 100%; }
    .admin-panel { position: fixed; top: 0; right: 0; width: min(480px, 100vw); height: 100vh; background: #1A1A1A; color: white; z-index: 999; overflow-y: auto; box-shadow: -8px 0 40px rgba(0,0,0,0.3); padding: 28px 24px; }
    .admin-h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--red); margin: 24px 0 10px; font-weight: 700; }
    .admin-input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 11px 14px; color: white; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; margin-bottom: 8px; transition: border 0.2s; }
    .admin-input:focus { border-color: var(--red); }
    .admin-textarea { min-height: 75px; resize: vertical; }
    .admin-btn { background: var(--red); color: white; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s; }
    .admin-btn:hover { opacity: 0.85; }
    .admin-ghost { background: rgba(255,255,255,0.08); color: white; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; }
    .admin-ghost:hover { background: rgba(255,255,255,0.14); }
    .admin-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 11px 14px; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .admin-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 15px; flex-shrink: 0; padding: 0 2px; }
    .tab-btn { padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .tab-btn.active { background: var(--red); color: white; }
    .tab-btn:not(.active) { background: rgba(255,255,255,0.07); color: #aaa; }

    /* LOADING */
    .loading { position: fixed; inset: 0; background: var(--red); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 20px; }
    .loading p { color: white; font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .hero-stats { grid-template-columns: repeat(3, 1fr); }

    @media (max-width: 600px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }

      .hero { padding: 36px 20px 32px; }
      .section { padding: 36px 20px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .day-header { padding: 16px 18px; }
      .day-body { padding: 0 18px 18px; }
      .day-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>

async function loadData() {
  try {
    const { data: row, error } = await sb.from('trip_data').select('content').eq('id', 1).single();
    if (error || !row || !row.content || Object.keys(row.content).length === 0) {
      await sb.from('trip_data').upsert({ id: 1, content: DEFAULT_DATA });
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
    return row.content;
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}

async function saveData(d) {
  try {
    const { error } = await sb.from('trip_data').update({ content: d }).eq('id', 1);
    if (error) throw error;
  } catch(e) { showToast('Errore nel salvataggio ❌', false); }
}

function showToast(msg, ok=true) {
  const t = document.createElement('div');
  t.textContent = (ok?'✓ ':'⚠ ') + msg;
  t.style.cssText = `position:fixed;bottom:80px;right:20px;background:${ok?'#2d6a4f':'#c0392b'};color:white;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2);transition:opacity 0.3s;font-family:'Inter',sans-serif;`;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2500);
}

function toggleAdmin() { adminOpen = !adminOpen; render(); }
function closeAdmin() { adminOpen = false; render(); }
function toggleMobileMenu() { mobileMenuOpen = !mobileMenuOpen; render(); }
function setTab(t) { adminTab = t; render(); }
function toggleDay(i) { openDay = openDay===i ? null : i; render(); }

function checkPwd() {
  const val = document.getElementById('admin-pwd').value;
  if (val === ADMIN_PASSWORD) { adminAuthenticated = true; localStorage.setItem('weroad_admin','yes'); render(); }
  else { document.getElementById('pwd-error').style.display = 'block'; }
}
function logoutAdmin() { adminAuthenticated = false; localStorage.removeItem('weroad_admin'); adminOpen = false; render(); }

function toggleCheck(i) {
  checkedItems[i] = !checkedItems[i];
  localStorage.setItem('weroad_checked', JSON.stringify(checkedItems));
  render();
}
function vote(pi, oi) {
  votedPolls[pi] = oi;
  localStorage.setItem('weroad_votes', JSON.stringify(votedPolls));
  render();
}

async function saveTrip() {
  data.tripName = document.getElementById('f-tripName').value;
  data.subtitle = document.getElementById('f-subtitle').value;
  data.dates = document.getElementById('f-dates').value;
  data.paxCount = document.getElementById('f-paxCount').value;
  data.coordinator = document.getElementById('f-coordinator').value;
  data.dmc = document.getElementById('f-dmc').value;
  data.dmcContact = document.getElementById('f-dmcContact').value;
  data.dmcNote = document.getElementById('f-dmcNote').value;
  await saveData(data); render(); showToast('Salvato!');
}
async function saveItineraryDay(i) {
  data.itinerary[i].city = document.getElementById(`it-city-${i}`).value;
  data.itinerary[i].description = document.getElementById(`it-desc-${i}`).value;
  data.itinerary[i].tip = document.getElementById(`it-tip-${i}`).value;
  data.itinerary[i].overnight = document.getElementById(`it-overnight-${i}`).value;
  data.itinerary[i].included = document.getElementById(`it-included-${i}`).value;
  await saveData(data); render(); showToast('Giorno salvato!');
}
async function saveHotel(i) {
  data.hotels[i].name = document.getElementById(`h-name-${i}`).value;
  data.hotels[i].info = document.getElementById(`h-info-${i}`).value;
  await saveData(data); render(); showToast('Hotel salvato!');
}
async function addParticipant() {
  const name = document.getElementById('new-p-name').value.trim();
  const city = document.getElementById('new-p-city').value.trim();
  const note = document.getElementById('new-p-note').value.trim();
  if (!name) return;
  data.participants.push({ name, city, note });
  await saveData(data); render(); showToast('Aggiunto!');
}
async function deleteParticipant(i) { data.participants.splice(i,1); await saveData(data); render(); }
async function addChecklistItem() {
  const val = document.getElementById('new-check').value.trim();
  if (!val) return;
  data.checklist.push(val);
  await saveData(data); render(); showToast('Voce aggiunta!');
}
async function deleteChecklistItem(i) {
  data.checklist.splice(i,1);
  const nc = {};
  Object.keys(checkedItems).forEach(k=>{ if(parseInt(k)!==i) nc[parseInt(k)>i?parseInt(k)-1:k]=checkedItems[k]; });
  checkedItems = nc;
  localStorage.setItem('weroad_checked', JSON.stringify(checkedItems));
  await saveData(data); render();
}
async function savePoll(pi) {
  data.polls[pi].question = document.getElementById(`poll-q-${pi}`).value;
  data.polls[pi].options = data.polls[pi].options.map((_,oi)=>document.getElementById(`poll-opt-${pi}-${oi}`).value).filter(Boolean);
  await saveData(data); render(); showToast('Salvato!');
}
async function addPollOption(pi) { await savePoll(pi); data.polls[pi].options.push('Nuova opzione'); await saveData(data); render(); }
async function deletePollOption(pi,oi) { data.polls[pi].options.splice(oi,1); await saveData(data); render(); }
async function deletePoll(pi) { data.polls.splice(pi,1); await saveData(data); render(); }
async function addPoll() {
  const q=document.getElementById('new-poll-q').value.trim();
  const o1=document.getElementById('new-poll-o1').value.trim();
  const o2=document.getElementById('new-poll-o2').value.trim();
  const o3=document.getElementById('new-poll-o3').value.trim();
  if(!q||!o1||!o2) return;
  const opts=[o1,o2]; if(o3) opts.push(o3);
  data.polls.push({question:q,options:opts});
  await saveData(data); render(); showToast('Sondaggio creato!');
}
async function resetData() {
  if(!confirm('Sei sicuro? Tutti i dati verranno persi.')) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  await saveData(data); render();
}

async function init() { data = await loadData(); render(); }
init();
</script>
