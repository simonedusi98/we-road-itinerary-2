<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Experience — WeRoad</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F5F5F5; color: #111; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #FF5A4F; border-radius: 3px; }

    /* ADMIN PANEL */
    .admin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .admin-modal { background: #111; color: white; border-radius: 24px; padding: 48px; max-width: 500px; width: 90%; }
    .admin-panel { position: fixed; top: 0; right: -520px; width: 500px; height: 100vh; background: #111; color: white; z-index: 999; transition: right 0.35s cubic-bezier(.4,0,.2,1); overflow-y: auto; box-shadow: -8px 0 40px rgba(0,0,0,0.4); padding: 32px 28px; }
    .admin-panel.open { right: 0; }
    .admin-panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #FF5A4F; margin: 28px 0 12px; }
    .admin-panel h3:first-child { margin-top: 0; }
    .admin-input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 11px 14px; color: white; font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 8px; transition: border 0.2s; }
    .admin-input:focus { border-color: #FF5A4F; }
    .admin-textarea { min-height: 80px; resize: vertical; }
    .admin-btn { background: #FF5A4F; color: white; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.2s; }
    .admin-btn:hover { opacity: 0.85; }
    .admin-btn-ghost { background: rgba(255,255,255,0.08); color: white; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .admin-btn-ghost:hover { background: rgba(255,255,255,0.15); }
    .admin-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .admin-item-text { font-size: 13px; color: #ccc; flex: 1; line-height: 1.5; }
    .admin-del { background: none; border: none; color: #FF5A4F; cursor: pointer; font-size: 16px; flex-shrink: 0; padding: 0 4px; }
    .tab-btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .tab-btn.active { background: #FF5A4F; color: white; }
    .tab-btn:not(.active) { background: rgba(255,255,255,0.08); color: #aaa; }

    /* SITE */
    .nav-link { color: white; text-decoration: none; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
    .nav-link:hover { color: #FF5A4F; }
    .card { background: white; border-radius: 24px; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); }
    .dark-card { background: #111; border-radius: 24px; color: white; }
    .badge { display: inline-block; border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .badge-red { background: #FF5A4F; color: white; }
    .badge-dark { background: #222; color: white; }
    .badge-green { background: #2d6a4f; color: #b7e4c7; }
    .section { max-width: 1280px; margin: 0 auto; padding: 48px 24px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; }
    .h2 { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 900; margin-bottom: 32px; }
    .day-card { background: white; border-radius: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; position: relative; }
    .day-dot { position: absolute; left: -42px; top: 32px; height: 20px; width: 20px; border-radius: 50%; background: #FF5A4F; }
    .day-header { padding: 24px 28px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .day-body { padding: 0 28px 28px; border-top: 1px solid #f0f0f0; }
    .tip-box { background: #fff8f7; border-radius: 16px; padding: 20px; border: 1px solid #ffe0de; }
    .checklist-item { display: flex; align-items: center; gap: 14px; border-radius: 16px; border: 1px solid #eee; padding: 14px 18px; cursor: pointer; transition: all 0.2s; }
    .checklist-item.done { border-color: #FF5A4F; background: #fff5f4; }
    .checkbox { height: 22px; width: 22px; flex-shrink: 0; border-radius: 6px; border: 2px solid #ccc; background: white; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .checkbox.done { border-color: #FF5A4F; background: #FF5A4F; }
    .poll-option { width: 100%; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); padding: 14px 18px; text-align: left; color: white; font-size: 15px; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .poll-option.voted { border-color: #FF5A4F; background: #FF5A4F; font-weight: 700; }
    .admin-trigger { position: fixed; bottom: 24px; right: 24px; background: #111; color: white; border: none; border-radius: 999px; padding: 12px 22px; font-size: 13px; font-weight: 700; cursor: pointer; z-index: 998; box-shadow: 0 4px 20px rgba(0,0,0,0.3); font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .admin-trigger:hover { background: #FF5A4F; }
    @media (max-width: 900px) { .grid-4,.grid-3 { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 600px) { .grid-4,.grid-3,.grid-2 { grid-template-columns: 1fr; } .h2 { font-size: 32px; } }
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================
// DATA STORE — usa localStorage per persistenza
// ============================================================
const DEFAULT_DATA = {
  tripName: 'India Experience',
  subtitle: 'Delhi • Agra • Jaipur • Pushkar • Jodhpur',
  dates: 'Agosto 2026',
  participants: '12 Pax',
  coordinator: 'Simone',
  dmc: 'Cloud Itineraries DMC',
  dmcContact: 'Anjani Nandan: +91 99539 18980',
  dmcNote: 'Contattare 1-2 giorni prima della partenza. Il DMC condividerà contatti del driver e guida per ogni città.',

  infoCards: [
    { title: '📄 Documenti', items: ['Passaporto: min. 6 mesi validità', 'e-Tourist Visa (ETA) — 25$', 'Richiedere 30-4 giorni prima', 'Digital Arrival Card entro 72h dalla partenza'] },
    { title: '💉 Vaccini', items: ['Epatite A/B (consigliato)', 'Tifo, Colera (consigliato)', 'Encefalite giapponese, Rabbia', 'Febbre gialla: solo se da paese endemico'] },
    { title: '💊 Salute', items: ['Fermenti lattici prima della partenza', 'Antiacidi + antidiarroici', 'Antizanzare', 'Mascherina antipolvere', 'Igienizzante mani'] },
    { title: '👗 Cosa Portare', items: ['Pantaloni lunghi + maglie maniche lunghe', 'Temple socks nello zaino', 'Sarong/velo per donne nei templi', 'Giacca per la sera (escursione termica 15-20°)', 'Scarpe comode'] },
    { title: '💰 Soldi', items: ['Valuta: Rupia Indiana (INR)', '1€ ≈ 95 INR', 'Money Pot: 200€ (totale stimato 400€)', 'Street food: ~100 rp (≈1,20€)', 'Cena con alcol: ~1.400-1.600 rp/pax', 'Mancia autista: ~2€/giorno/pax', 'Revolut consigliata'] },
    { title: '📱 App & SIM', items: ['Scarica UBER o OLA prima di partire', 'eSIM: Airalo o Holafly', 'SIM acquistabile aeroporto Delhi', 'App: Indian Visa Su-Swagatam'] },
    { title: '🚗 Trasporti', items: ['Evitare rush hour (9-10 e 17:30-19)', 'Tuk-tuk: tariffa notturna +20%', 'Uber/Ola: un\'app per volta, pagamento cash', 'Volo domestico: 15kg + 7kg cabina'] },
    { title: '⚠️ Consigli', items: ['Flessibilità è la chiave', 'Nebbia a Delhi/Agra: chiedere orari strategici alla guida', 'Fila separata stranieri agli attrazioni', 'Contrattare è normale al mercato', 'Alcol: caro, non sempre disponibile'] },
  ],

  itinerary: [
    { day: 'Giorno 1', city: 'Delhi', overnight: 'Delhi', included: '—', guide: false, description: 'Arrivo, check-in, prima cena libera. Primo impatto con il caos indiano.', highlights: ['Hauz Khas Village (ristoranti & bar)', 'Connaught Place', 'Bar: Unplugged Courtyard, WOMB'], tip: 'Prenditi la serata con calma. Domani si parte presto.' },
    { day: 'Giorno 2', city: 'Delhi → Agra', overnight: 'Agra', included: 'Colazione', guide: true, description: 'Tour Old Delhi con guida (Jama Masjid, Chandni Chowk in rickshaw, India Gate). Transfer Delhi→Agra (4h).', highlights: ['Jama Masjid', 'Chandni Chowk in rickshaw', 'India Gate & Parliament (drive-pass)', 'Dinner: Sheroes Hangout o Street Food Sadar Bazar'], tip: 'Partenza ore 8:00. Pranzo street food a Chandni Chowk. Transfer verso Agra ore 15:00.' },
    { day: 'Giorno 3', city: 'Agra → Jaipur', overnight: 'Jaipur', included: 'Colazione', guide: true, description: 'Taj Mahal all\'alba, Agra Fort. Transfer Agra→Jaipur (5h) con soste opzionali.', highlights: ['Taj Mahal all\'alba ⭐', 'Agra Fort', 'Fatehpur Sikri (opzionale)', 'Abhaneri Stepwell (opzionale)', 'Pranzo: samosa fuori Agra Fort'], tip: '⚠️ Al Taj: NO zaini grandi, cibo, liquidi, badge WeRoad. Lascia tutto nel bus. Min. 3h di visita. Partenza da Agra entro le 15:00.' },
    { day: 'Giorno 4', city: 'Jaipur', overnight: 'Jaipur', included: 'Colazione + Cena', guide: true, description: 'Amber Fort, City Palace, Jantar Mantar, Hawa Mahal. Pomeriggio mercati. Cena con famiglia locale (inclusa).', highlights: ['Amber Fort ⭐', 'City Palace, Jantar Mantar, Hawa Mahal', 'Mercati: Johri Bazar, Bapu Bazaar', 'Bollywood Dance Class (opzionale)', 'Raj Mandir Cinema Bollywood (serata)'], tip: 'Non prendere le jeep al parcheggio di Amber Fort — 15 min a piedi. Mercati chiudono alle 19:30.' },
    { day: 'Giorno 5', city: 'Jaipur → Pushkar', overnight: 'Pushkar', included: 'Colazione', guide: true, description: 'Partenza ore 8:00. Transfer (3h). Brahma Temple, Pushkar Lake, Savitri Temple al tramonto.', highlights: ['Brahma Temple ⭐', 'Pushkar Lake & Puja', 'Savitri Temple al tramonto ⭐', 'Mercato Main Market Road', 'Dinner: Real Out of the Blue (rooftop)'], tip: 'Per Savitri Temple: funivia solo 12 pax per ciclo. Se fila lunga → a piedi. Attenzione offerte Brahmin al lago: min. 2100 rp.' },
    { day: 'Giorno 6', city: 'Pushkar → Jodhpur', overnight: 'Jodhpur', included: 'Colazione', guide: true, description: 'Mattina libera per shopping o yoga all\'alba. Partenza ore 14-15, transfer (5h).', highlights: ['Yoga session all\'alba (opzionale)', 'Street food a Pushkar', 'Dinner: Blue Bird Rooftop (musica dal vivo Rajasthan)'], tip: 'Serata rilassata al Blue Bird — musica live fino alle 22:30. Tour leader free.' },
    { day: 'Giorno 7', city: 'Jodhpur', overnight: 'Jodhpur', included: 'Colazione + Cena', guide: true, description: 'Mehrangarh Fort, Blue City a piedi. Pomeriggio cooking class con famiglia locale (inclusa).', highlights: ['Mehrangarh Fort ⭐', 'Flying Fox zipline (opzionale)', 'Blue City walk — quartiere Navchowkiya', 'Cooking class con famiglia locale ⭐'], tip: 'Fort apre alle 9:00. Flying Fox: 6 zipline sulle mura — prenotare tramite guida. Cooking class: dividere il gruppo a turni.' },
    { day: 'Giorno 8', city: 'Jodhpur → Delhi', overnight: 'Delhi', included: 'Colazione', guide: false, description: 'Mattina: mercati di Jodhpur. Volo domestico Jodhpur→Delhi (gestito DMC). Serata libera a Delhi.', highlights: ['Mercati Clock Square', 'Volo domestico ✈️ (15kg bagaglio incluso)', 'Dinner: Baris GK-3 (~1600 rp/pax)'], tip: 'Arriva in aeroporto 2h prima. Check-in online con codice PNR del DMC.' },
    { day: 'Giorno 9', city: 'Delhi', overnight: '—', included: 'Colazione', guide: false, description: 'Fine viaggio. Colazione e trasferimento autonomo in aeroporto.', highlights: ['Transfer aeroporto NON incluso — organizzare autonomamente'], tip: 'Volo di rientro non incluso nel pacchetto WeRoad.' },
  ],

  transports: [
    { type: '🚐 Van', route: 'Delhi → Agra', detail: 'Giorno 2 • 4h con soste • Partenza ore 15:00', prepaid: true },
    { type: '🚐 Van', route: 'Agra → Jaipur', detail: 'Giorno 3 • 5h con soste • Partenza entro ore 15:00', prepaid: true },
    { type: '🚐 Van', route: 'Jaipur → Pushkar', detail: 'Giorno 5 • 3h con soste • Partenza ore 8:00', prepaid: true },
    { type: '🚐 Van', route: 'Pushkar → Jodhpur', detail: 'Giorno 6 • 5h con soste • Partenza ore 14-15', prepaid: true },
    { type: '✈️ Volo', route: 'Jodhpur → Delhi', detail: 'Giorno 8 • 15kg bagaglio incluso • Check-in con PNR DMC', prepaid: true },
    { type: '🚖 Locale', route: 'Tuk-tuk / Uber / Ola', detail: 'Trasferimenti locali • Tariffa notturna +20%', prepaid: false },
  ],

  hotels: [
    { city: 'Delhi', name: 'TBD', info: 'Notti 1 & 8 • WiFi • Colazione inclusa' },
    { city: 'Agra', name: 'TBD', info: 'Notte 2 • Check-in 14:00 • WiFi • Colazione inclusa' },
    { city: 'Jaipur', name: 'TBD', info: 'Notti 3 & 4 • Check-in 14:00 • WiFi • Colazione inclusa' },
    { city: 'Pushkar', name: 'TBD', info: 'Notte 5 • Check-in 14:00 • WiFi • Colazione inclusa' },
    { city: 'Jodhpur', name: 'TBD', info: 'Notti 6 & 7 • Check-in 14:00 • WiFi • Colazione inclusa' },
  ],

  checklist: [
    'Passaporto (min. 6 mesi validità)',
    'e-Tourist Visa (ETA) — applicare 30-4 giorni prima',
    'Digital Arrival Card (entro 72h dalla partenza)',
    'Fermenti lattici (iniziare prima della partenza)',
    'Antiacidi + antidiarroici',
    'Mascherina antipolvere',
    'Temple socks',
    'Pantaloni lunghi + maglie maniche lunghe',
    'Sarong/velo (per le donne)',
    'Scarpe comode da camminata',
    'Igienizzante mani',
    'Powerbank',
    'Adattatore universale',
    'App UBER o OLA scaricata',
    'eSIM Airalo/Holafly attivata',
    'Revolut o contante Euro',
    'Giacca/maglione per la sera',
    'Antizanzare',
  ],

  polls: [
    { question: 'Cena finale a Jaipur?', options: ['Rooftop', 'Street Food Tour', 'Ristorante tipico'] },
    { question: 'Attività opzionale Agra→Jaipur?', options: ['Fatehpur Sikri', 'Abhaneri Stepwell', 'Entrambe'] },
    { question: 'Serata a Jodhpur?', options: ['Flying Fox zipline', 'Blue City walk', 'Raj Mandir Cinema'] },
  ],

  participants: [
    { name: 'Simone', city: 'Milano', note: 'Travel Coordinator 🎯' },
  ],
};

function loadData() {
  try {
    const saved = localStorage.getItem('weroad_data');
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}

function saveData(data) {
  localStorage.setItem('weroad_data', JSON.stringify(data));
}

// ============================================================
// STATE
// ============================================================
let data = loadData();
let adminOpen = false;
let adminAuthenticated = localStorage.getItem('weroad_admin') === 'yes';
let adminTab = 'trip';
let openDay = null;
let checkedItems = JSON.parse(localStorage.getItem('weroad_checked') || '{}');
let votedPolls = JSON.parse(localStorage.getItem('weroad_votes') || '{}');
const ADMIN_PASSWORD = 'weroad2026';

// ============================================================
// RENDER
// ============================================================
function render() {
  document.getElementById('app').innerHTML = buildHTML();
  attachEvents();
}

function buildHTML() {
  return `
    ${buildNav()}
    ${buildHero()}
    ${buildInfoCards()}
    ${buildItinerary()}
    ${buildTransports()}
    ${buildHotels()}
    ${buildParticipants()}
    ${buildChecklist()}
    ${buildPolls()}
    ${buildDMC()}
    ${buildAdminTrigger()}
    ${adminOpen ? (adminAuthenticated ? buildAdminPanel() : buildAdminLogin()) : ''}
  `;
}

function buildNav() {
  return `
    <header style="position:sticky;top:0;z-index:50;border-bottom:1px solid #2A2A2A;background:#111;color:white;">
      <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;flex-wrap:wrap;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="height:12px;width:12px;border-radius:50%;background:#FF5A4F;"></div>
          <h1 style="font-size:24px;font-weight:900;letter-spacing:3px;font-family:'DM Sans',sans-serif;">WEROAD</h1>
        </div>
        <nav style="display:flex;gap:20px;flex-wrap:wrap;">
          ${[['#info','Info'],['#itinerario','Itinerario'],['#trasporti','Trasporti'],['#hotel','Hotel'],['#partecipanti','Team'],['#checklist','Checklist'],['#sondaggi','Sondaggi'],['#dmc','DMC']].map(([h,l]) => `<a class="nav-link" href="${h}">${l}</a>`).join('')}
        </nav>
      </div>
    </header>`;
}

function buildHero() {
  return `
    <section id="info" style="max-width:1280px;margin:0 auto;padding:40px 24px 0;">
      <div style="position:relative;overflow:hidden;border-radius:36px;background:#111;padding:64px;color:white;box-shadow:0 25px 60px rgba(0,0,0,0.3);">
        <div style="position:absolute;right:-120px;top:-60px;height:320px;width:320px;border-radius:50%;background:rgba(255,90,79,0.2);"></div>
        <div style="position:absolute;bottom:-100px;left:40%;height:220px;width:220px;border-radius:50%;background:rgba(255,90,79,0.1);"></div>
        <div style="position:relative;z-index:1;">
          <p style="margin-bottom:16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.3em;color:#FFB0AA;">Viaggio WeRoad</p>
          <h2 style="font-family:'Playfair Display',serif;font-size:68px;font-weight:900;line-height:1.05;">${data.tripName}</h2>
          <p style="margin-top:20px;font-size:18px;line-height:1.7;color:#ccc;">${data.subtitle}</p>
          <div style="margin-top:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:24px;">
            ${[['Destinazione','India 🇮🇳'],['Date',data.dates],['Partecipanti',data.participants],['Coordinator',data.coordinator],['DMC',data.dmc]].map(([l,v]) => `
              <div>
                <p style="font-size:11px;text-transform:uppercase;color:#999;letter-spacing:1px;">${l}</p>
                <p style="margin-top:8px;font-size:17px;font-weight:700;">${v}</p>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </section>`;
}

function buildInfoCards() {
  return `
    <section style="max-width:1280px;margin:0 auto;padding:32px 24px;">
      <div class="grid-4">
        ${data.infoCards.map(c => `
          <div class="card" style="padding:24px;">
            <h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">${c.title}</h3>
            <ul style="list-style:none;display:flex;flex-direction:column;gap:7px;">
              ${c.items.map(i => `<li style="font-size:13px;color:#555;line-height:1.5;padding-left:12px;border-left:2px solid #FF5A4F;">${i}</li>`).join('')}
            </ul>
          </div>`).join('')}
      </div>
    </section>`;
}

function buildItinerary() {
  return `
    <section id="itinerario" class="section">
      <h2 class="h2">Itinerario Giorno per Giorno</h2>
      <div style="border-left:2px solid #ddd;padding-left:32px;display:flex;flex-direction:column;gap:20px;">
        ${data.itinerary.map((item, i) => `
          <div class="day-card" id="day-${i}">
            <div class="day-dot"></div>
            <div class="day-header" onclick="toggleDay(${i})">
              <div style="flex:1;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
                  <span class="badge badge-red">${item.day}</span>
                  ${item.guide ? '<span class="badge badge-dark">🧭 Guida inclusa</span>' : ''}
                  <span class="badge badge-green">🍳 ${item.included}</span>
                </div>
                <h3 style="font-size:26px;font-weight:800;">${item.city}</h3>
                <p style="margin-top:6px;font-size:14px;color:#666;line-height:1.6;">${item.description}</p>
              </div>
              <span style="font-size:20px;color:#FF5A4F;margin-left:16px;flex-shrink:0;">${openDay === i ? '▲' : '▼'}</span>
            </div>
            ${openDay === i ? `
              <div class="day-body">
                <div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                  <div>
                    <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#FF5A4F;margin-bottom:10px;">Highlights</p>
                    <ul style="list-style:none;display:flex;flex-direction:column;gap:8px;">
                      ${item.highlights.map(h => `<li style="font-size:14px;color:#333;padding-left:14px;border-left:2px solid #FF5A4F;line-height:1.5;">${h}</li>`).join('')}
                    </ul>
                  </div>
                  <div class="tip-box">
                    <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#FF5A4F;margin-bottom:10px;">💡 Tip Coordinatore</p>
                    <p style="font-size:14px;color:#444;line-height:1.7;">${item.tip}</p>
                    <p style="margin-top:12px;font-size:13px;color:#888;">🏨 Overnight: <strong>${item.overnight}</strong></p>
                  </div>
                </div>
              </div>` : ''}
          </div>`).join('')}
      </div>
    </section>`;
}

function buildTransports() {
  return `
    <section id="trasporti" class="section">
      <h2 class="h2">Spostamenti</h2>
      <div class="grid-3">
        ${data.transports.map((t,i) => `
          <div class="dark-card" style="padding:28px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
              <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.2em;color:#FFB0AA;">${t.type}</p>
              <span style="font-size:11px;background:${t.prepaid ? 'rgba(76,175,80,0.3)' : 'rgba(255,90,79,0.3)'};color:${t.prepaid ? '#a5d6a7' : '#FFB0AA'};padding:3px 10px;border-radius:999px;font-weight:700;">${t.prepaid ? 'Prepagato WR' : 'Da pagare'}</span>
            </div>
            <h3 style="font-size:21px;font-weight:800;margin-bottom:8px;">${t.route}</h3>
            <p style="font-size:13px;color:#aaa;line-height:1.6;">${t.detail}</p>
          </div>`).join('')}
      </div>
    </section>`;
}

function buildHotels() {
  return `
    <section id="hotel" class="section">
      <h2 class="h2">Hotel & Stay</h2>
      <div class="grid-3">
        ${data.hotels.map((h,i) => `
          <div class="card" style="overflow:hidden;">
            <div style="height:140px;background:linear-gradient(135deg,#111,#FF5A4F);display:flex;align-items:center;justify-content:center;">
              <p style="color:white;font-weight:900;font-size:26px;font-family:'Playfair Display',serif;">${h.city}</p>
            </div>
            <div style="padding:22px;">
              <h3 style="font-size:17px;font-weight:700;">${h.name}</h3>
              <p style="margin-top:8px;font-size:13px;color:#7A7A7A;">${h.info}</p>
            </div>
          </div>`).join('')}
      </div>
    </section>`;
}

function buildParticipants() {
  return `
    <section id="partecipanti" class="section">
      <h2 class="h2">Il Team</h2>
      <div class="grid-3">
        ${data.participants.map((p,i) => `
          <div class="card" style="padding:28px;">
            <div style="display:flex;align-items:center;gap:16px;">
              <div style="height:60px;width:60px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:white;flex-shrink:0;">${p.name.charAt(0)}</div>
              <div>
                <h3 style="font-size:20px;font-weight:700;">${p.name}</h3>
                <p style="color:#7A7A7A;font-size:14px;">${p.city}</p>
              </div>
            </div>
            ${p.note ? `<p style="margin-top:16px;font-size:14px;color:#666;">${p.note}</p>` : ''}
          </div>`).join('')}
      </div>
    </section>`;
}

function buildChecklist() {
  const done = Object.values(checkedItems).filter(Boolean).length;
  return `
    <section id="checklist" class="section">
      <h2 class="h2">Checklist Partenza</h2>
      <div style="background:white;border-radius:32px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
        <div class="grid-2">
          ${data.checklist.map((item,i) => `
            <div class="checklist-item ${checkedItems[i] ? 'done' : ''}" onclick="toggleCheck(${i})">
              <div class="checkbox ${checkedItems[i] ? 'done' : ''}">${checkedItems[i] ? '<span style="color:white;font-size:13px;font-weight:900;">✓</span>' : ''}</div>
              <span style="font-size:15px;text-decoration:${checkedItems[i] ? 'line-through' : 'none'};color:${checkedItems[i] ? '#bbb' : '#111'};">${item}</span>
            </div>`).join('')}
        </div>
        <p style="margin-top:24px;text-align:center;font-size:14px;color:#aaa;">${done} / ${data.checklist.length} completati</p>
      </div>
    </section>`;
}

function buildPolls() {
  return `
    <section id="sondaggi" class="section">
      <h2 class="h2">Sondaggi</h2>
      <div class="grid-3">
        ${data.polls.map((poll,pi) => `
          <div class="dark-card" style="padding:28px;">
            <h3 style="font-size:20px;font-weight:800;margin-bottom:22px;">${poll.question}</h3>
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${poll.options.map((opt,oi) => `
                <button class="poll-option ${votedPolls[pi]===oi ? 'voted' : ''}" onclick="vote(${pi},${oi})">
                  ${votedPolls[pi]===oi ? '✓ ' : ''}${opt}
                </button>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </section>`;
}

function buildDMC() {
  return `
    <section id="dmc" style="max-width:1280px;margin:0 auto;padding:48px 24px 96px;">
      <h2 class="h2">Contatti DMC</h2>
      <div class="grid-2">
        <div class="dark-card" style="padding:36px;">
          <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.2em;color:#FFB0AA;margin-bottom:12px;">Partner Locale</p>
          <h3 style="font-size:26px;font-weight:900;margin-bottom:8px;">${data.dmc}</h3>
          <p style="font-size:18px;font-weight:700;color:#FF5A4F;margin-bottom:16px;">📞 ${data.dmcContact}</p>
          <p style="font-size:14px;color:#888;line-height:1.7;">${data.dmcNote}</p>
        </div>
        <div class="card" style="padding:36px;">
          <p style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#FF5A4F;margin-bottom:16px;">Il DMC gestisce:</p>
          ${['Alloggi','Transfer terrestri','Attività incluse nel pacchetto WR','Attività opzionali (prenotare tramite DMC)','Cambio valuta + SIM card','Emergenze e problemi in loco'].map((item,i,arr) => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:${i<arr.length-1 ? '1px solid #f0f0f0' : 'none'};">
              <div style="width:8px;height:8px;border-radius:50%;background:#FF5A4F;flex-shrink:0;"></div>
              <span style="font-size:15px;">${item}</span>
            </div>`).join('')}
        </div>
      </div>
    </section>`;
}

function buildAdminTrigger() {
  return `<button class="admin-trigger" onclick="toggleAdmin()">⚙️ ${adminAuthenticated ? 'Admin' : 'Admin'}</button>`;
}

function buildAdminLogin() {
  return `
    <div class="admin-overlay" onclick="closeAdminOverlay(event)">
      <div class="admin-modal">
        <h2 style="font-size:24px;font-weight:900;margin-bottom:8px;">Accesso Admin</h2>
        <p style="color:#888;font-size:14px;margin-bottom:28px;">Solo per il coordinatore WeRoad</p>
        <input class="admin-input" type="password" id="admin-pwd" placeholder="Password" onkeydown="if(event.key==='Enter')checkPwd()" autofocus />
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button class="admin-btn" onclick="checkPwd()" style="flex:1;">Accedi</button>
          <button class="admin-btn-ghost" onclick="closeAdmin()">Annulla</button>
        </div>
        <p id="pwd-error" style="color:#FF5A4F;font-size:13px;margin-top:12px;display:none;">Password errata</p>
      </div>
    </div>`;
}

function buildAdminPanel() {
  return `
    <div class="admin-panel open" id="admin-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <h2 style="font-size:18px;font-weight:900;">Pannello Admin</h2>
        <button class="admin-btn-ghost" onclick="closeAdmin()" style="padding:8px 14px;">✕ Chiudi</button>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">
        ${[['trip','🗺 Viaggio'],['itinerary','📅 Itinerario'],['hotels','🏨 Hotel'],['participants','👥 Team'],['checklist','✅ Checklist'],['polls','🗳 Sondaggi']].map(([t,l]) => `
          <button class="tab-btn ${adminTab===t?'active':''}" onclick="setTab('${t}')">${l}</button>`).join('')}
      </div>

      ${adminTab === 'trip' ? `
        <h3>Info Generali</h3>
        <input class="admin-input" id="f-tripName" value="${data.tripName}" placeholder="Nome viaggio" />
        <input class="admin-input" id="f-subtitle" value="${data.subtitle}" placeholder="Subtitle" />
        <input class="admin-input" id="f-dates" value="${data.dates}" placeholder="Date" />
        <input class="admin-input" id="f-participants" value="${data.participants}" placeholder="N. partecipanti" />
        <input class="admin-input" id="f-coordinator" value="${data.coordinator}" placeholder="Coordinator" />
        <h3>DMC</h3>
        <input class="admin-input" id="f-dmc" value="${data.dmc}" placeholder="Nome DMC" />
        <input class="admin-input" id="f-dmcContact" value="${data.dmcContact}" placeholder="Contatto DMC" />
        <textarea class="admin-input admin-textarea" id="f-dmcNote" placeholder="Note DMC">${data.dmcNote}</textarea>
        <button class="admin-btn" onclick="saveTrip()" style="width:100%;margin-top:8px;">💾 Salva</button>
      ` : ''}

      ${adminTab === 'itinerary' ? `
        ${data.itinerary.map((item,i) => `
          <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin-bottom:12px;">
            <p style="font-size:13px;font-weight:700;color:#FF5A4F;margin-bottom:10px;">${item.day} — ${item.city}</p>
            <input class="admin-input" id="it-city-${i}" value="${item.city}" placeholder="Città" />
            <textarea class="admin-input admin-textarea" id="it-desc-${i}" placeholder="Descrizione">${item.description}</textarea>
            <textarea class="admin-input admin-textarea" id="it-tip-${i}" placeholder="Tip coordinatore">${item.tip}</textarea>
            <input class="admin-input" id="it-overnight-${i}" value="${item.overnight}" placeholder="Overnight" />
            <input class="admin-input" id="it-included-${i}" value="${item.included}" placeholder="Pasti inclusi" />
            <button class="admin-btn" onclick="saveItineraryDay(${i})" style="width:100%;">💾 Salva ${item.day}</button>
          </div>`).join('')}
      ` : ''}

      ${adminTab === 'hotels' ? `
        ${data.hotels.map((h,i) => `
          <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin-bottom:10px;">
            <p style="font-size:13px;font-weight:700;color:#FF5A4F;margin-bottom:8px;">${h.city}</p>
            <input class="admin-input" id="h-name-${i}" value="${h.name}" placeholder="Nome hotel" />
            <input class="admin-input" id="h-info-${i}" value="${h.info}" placeholder="Info hotel" />
            <button class="admin-btn" onclick="saveHotel(${i})" style="width:100%;">💾 Salva</button>
          </div>`).join('')}
      ` : ''}

      ${adminTab === 'participants' ? `
        <h3>Partecipanti</h3>
        ${data.participants.map((p,i) => `
          <div class="admin-item">
            <div class="admin-item-text"><strong>${p.name}</strong> — ${p.city}${p.note ? ' • '+p.note : ''}</div>
            <button class="admin-del" onclick="deleteParticipant(${i})">✕</button>
          </div>`).join('')}
        <h3>Aggiungi Partecipante</h3>
        <input class="admin-input" id="new-p-name" placeholder="Nome" />
        <input class="admin-input" id="new-p-city" placeholder="Città" />
        <input class="admin-input" id="new-p-note" placeholder="Note (es. ruolo, hobby)" />
        <button class="admin-btn" onclick="addParticipant()" style="width:100%;">+ Aggiungi</button>
      ` : ''}

      ${adminTab === 'checklist' ? `
        <h3>Voci Checklist</h3>
        ${data.checklist.map((item,i) => `
          <div class="admin-item">
            <span class="admin-item-text">${item}</span>
            <button class="admin-del" onclick="deleteChecklistItem(${i})">✕</button>
          </div>`).join('')}
        <h3>Aggiungi voce</h3>
        <input class="admin-input" id="new-check" placeholder="Nuova voce checklist" />
        <button class="admin-btn" onclick="addChecklistItem()" style="width:100%;">+ Aggiungi</button>
      ` : ''}

      ${adminTab === 'polls' ? `
        <h3>Sondaggi</h3>
        ${data.polls.map((poll,pi) => `
          <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin-bottom:12px;">
            <input class="admin-input" id="poll-q-${pi}" value="${poll.question}" placeholder="Domanda" />
            ${poll.options.map((opt,oi) => `
              <div style="display:flex;gap:6px;">
                <input class="admin-input" id="poll-opt-${pi}-${oi}" value="${opt}" placeholder="Opzione ${oi+1}" style="flex:1;margin-bottom:4px;" />
                <button class="admin-del" onclick="deletePollOption(${pi},${oi})" style="flex-shrink:0;padding:0 10px;">✕</button>
              </div>`).join('')}
            <div style="display:flex;gap:8px;margin-top:6px;">
              <button class="admin-btn-ghost" onclick="addPollOption(${pi})" style="flex:1;font-size:12px;">+ Opzione</button>
              <button class="admin-btn" onclick="savePoll(${pi})" style="flex:1;font-size:12px;">💾 Salva</button>
              <button class="admin-del" onclick="deletePoll(${pi})" style="padding:0 12px;">🗑</button>
            </div>
          </div>`).join('')}
        <h3>Nuovo Sondaggio</h3>
        <input class="admin-input" id="new-poll-q" placeholder="Domanda sondaggio" />
        <input class="admin-input" id="new-poll-o1" placeholder="Opzione 1" />
        <input class="admin-input" id="new-poll-o2" placeholder="Opzione 2" />
        <input class="admin-input" id="new-poll-o3" placeholder="Opzione 3 (opzionale)" />
        <button class="admin-btn" onclick="addPoll()" style="width:100%;">+ Crea Sondaggio</button>
      ` : ''}

      <div style="margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1);">
        <button class="admin-btn-ghost" onclick="resetData()" style="width:100%;font-size:12px;color:#888;">🔄 Reset dati originali</button>
        <button class="admin-btn-ghost" onclick="logoutAdmin()" style="width:100%;margin-top:8px;font-size:12px;">🚪 Logout</button>
      </div>
    </div>`;
}

// ============================================================
// EVENTS & ACTIONS
// ============================================================
function attachEvents() {}

function toggleAdmin() {
  adminOpen = !adminOpen;
  render();
}
function closeAdmin() { adminOpen = false; render(); }
function closeAdminOverlay(e) { if(e.target === e.currentTarget) closeAdmin(); }

function checkPwd() {
  const val = document.getElementById('admin-pwd').value;
  if(val === ADMIN_PASSWORD) {
    adminAuthenticated = true;
    localStorage.setItem('weroad_admin', 'yes');
    render();
  } else {
    document.getElementById('pwd-error').style.display = 'block';
  }
}

function logoutAdmin() {
  adminAuthenticated = false;
  localStorage.removeItem('weroad_admin');
  adminOpen = false;
  render();
}

function setTab(t) { adminTab = t; render(); }

function toggleDay(i) { openDay = openDay === i ? null : i; render(); }

function toggleCheck(i) {
  checkedItems[i] = !checkedItems[i];
  localStorage.setItem('weroad_checked', JSON.stringify(checkedItems));
  render();
}

function vote(pi, oi) {
  votedPolls[pi] = oi;
  localStorage.setItem('weroad_votes', JSON.stringify(votedPolls));
  render();
}

function saveTrip() {
  data.tripName = document.getElementById('f-tripName').value;
  data.subtitle = document.getElementById('f-subtitle').value;
  data.dates = document.getElementById('f-dates').value;
  data.participants = document.getElementById('f-participants').value;
  data.coordinator = document.getElementById('f-coordinator').value;
  data.dmc = document.getElementById('f-dmc').value;
  data.dmcContact = document.getElementById('f-dmcContact').value;
  data.dmcNote = document.getElementById('f-dmcNote').value;
  saveData(data); render(); showToast('Salvato!');
}

function saveItineraryDay(i) {
  data.itinerary[i].city = document.getElementById(`it-city-${i}`).value;
  data.itinerary[i].description = document.getElementById(`it-desc-${i}`).value;
  data.itinerary[i].tip = document.getElementById(`it-tip-${i}`).value;
  data.itinerary[i].overnight = document.getElementById(`it-overnight-${i}`).value;
  data.itinerary[i].included = document.getElementById(`it-included-${i}`).value;
  saveData(data); render(); showToast('Giorno salvato!');
}

function saveHotel(i) {
  data.hotels[i].name = document.getElementById(`h-name-${i}`).value;
  data.hotels[i].info = document.getElementById(`h-info-${i}`).value;
  saveData(data); render(); showToast('Hotel salvato!');
}

function addParticipant() {
  const name = document.getElementById('new-p-name').value.trim();
  const city = document.getElementById('new-p-city').value.trim();
  const note = document.getElementById('new-p-note').value.trim();
  if(!name) return;
  data.participants.push({ name, city, note });
  saveData(data); render(); showToast('Partecipante aggiunto!');
}

function deleteParticipant(i) {
  data.participants.splice(i,1);
  saveData(data); render();
}

function addChecklistItem() {
  const val = document.getElementById('new-check').value.trim();
  if(!val) return;
  data.checklist.push(val);
  saveData(data); render(); showToast('Voce aggiunta!');
}

function deleteChecklistItem(i) {
  data.checklist.splice(i,1);
  const newChecked = {};
  Object.keys(checkedItems).forEach(k => { if(parseInt(k) !== i) newChecked[parseInt(k) > i ? parseInt(k)-1 : k] = checkedItems[k]; });
  checkedItems = newChecked;
  localStorage.setItem('weroad_checked', JSON.stringify(checkedItems));
  saveData(data); render();
}

function savePoll(pi) {
  data.polls[pi].question = document.getElementById(`poll-q-${pi}`).value;
  data.polls[pi].options = data.polls[pi].options.map((_,oi) => document.getElementById(`poll-opt-${pi}-${oi}`).value).filter(Boolean);
  saveData(data); render(); showToast('Sondaggio salvato!');
}

function addPollOption(pi) {
  savePoll(pi);
  data.polls[pi].options.push('Nuova opzione');
  saveData(data); render();
}

function deletePollOption(pi, oi) {
  data.polls[pi].options.splice(oi,1);
  saveData(data); render();
}

function deletePoll(pi) {
  data.polls.splice(pi,1);
  saveData(data); render();
}

function addPoll() {
  const q = document.getElementById('new-poll-q').value.trim();
  const o1 = document.getElementById('new-poll-o1').value.trim();
  const o2 = document.getElementById('new-poll-o2').value.trim();
  const o3 = document.getElementById('new-poll-o3').value.trim();
  if(!q || !o1 || !o2) return;
  const opts = [o1, o2]; if(o3) opts.push(o3);
  data.polls.push({ question: q, options: opts });
  saveData(data); render(); showToast('Sondaggio creato!');
}

function resetData() {
  if(!confirm('Sei sicuro? Tutti i dati modificati verranno persi.')) return;
  localStorage.removeItem('weroad_data');
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData(data); render();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = '✓ ' + msg;
  t.style.cssText = 'position:fixed;bottom:80px;right:24px;background:#2d6a4f;color:white;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.3);transition:opacity 0.3s;';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 300); }, 2000);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
